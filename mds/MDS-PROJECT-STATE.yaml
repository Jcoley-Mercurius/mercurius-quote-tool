technical:
  framework: Next.js App Router
  framework_version: "16.2.9"
  language: TypeScript 5
  styling_system: Tailwind CSS 4 with limited custom CSS variables and many utility-level decisions
  component_system: Project-local React components; no formal reusable primitive library
  icon_implementation: Repeated project-local inline SVG icons
  font_implementation: Inter through next/font/google
  repository_structure: app routes plus components and domain libraries
  token_location: app/globals.css and tailwind.config.ts; incomplete semantic coverage
  component_location: components
  global_style_location: app/globals.css
  layout_location: app/layout.tsx and components/layout
  deployment_target: Vercel
  accessibility_tools: [eslint, React Testing Library, Playwright]
  test_tools: [Vitest, React Testing Library, Playwright]
  design_delivery_capability_signals:
    - id: MDS-CAP-001
      capability: Component composition and semantic token implementation
      applicable: [MDS-DEC-004 through MDS-DEC-018, MDS-REF-012 through MDS-REF-014]
      stage: D1 through D8
      evidence: Code diff plus rendered primitive and state inventory
      consequence_if_unavailable: Stop before route styling
    - id: MDS-CAP-002
      capability: Exact raster identity integration
      applicable: [MDS-DEC-031, MDS-REF-017]
      stage: [D0, D1, D6]
      evidence: Asset byte or checksum preservation plus header PDF and email renders
      consequence_if_unavailable: Branded surfaces cannot pass
    - id: MDS-CAP-003
      capability: Responsive browser inspection
      applicable: [MDS-DEC-019 through MDS-DEC-027, MDS-DEC-030, MDS-DEC-032, MDS-REF-013, MDS-REF-016, MDS-REF-018 through MDS-REF-023]
      stage: Every implementation slice
      evidence: Captures at 320 390 768 1024 and 1280-plus CSS pixels plus 200 percent zoom
      consequence_if_unavailable: Slice cannot clear its visual gate
    - id: MDS-CAP-004
      capability: Screenshot and canonical-reference comparison
      applicable: [MDS-DEC-028, MDS-DEC-029, MDS-DEC-033, MDS-DEC-034, MDS-REF-012 through MDS-REF-023]
      stage: D1 through D9
      evidence: Before and after captures with documented comparison findings
      consequence_if_unavailable: No fidelity claim; review required
    - id: MDS-CAP-005
      capability: Accessibility testing
      applicable: [WCAG 2.2 AA, component and composition accessibility rules]
      stage: D1 through D9
      evidence: Automated results plus keyboard focus screen-reader smoke reduced-motion and touch review
      consequence_if_unavailable: Slice cannot be done
    - id: MDS-CAP-006
      capability: Representative image and photo-state fixtures
      applicable: [Photo upload viewer and content-stress requirements]
      stage: [D5, D8]
      evidence: Missing loading failed large and many-image fixtures
      consequence_if_unavailable: Photo experience remains unverified
    - id: MDS-CAP-007
      capability: PDF email print and mobile-delivery rendering inspection
      applicable: [MDS-REF-022]
      stage: D6
      evidence: First and continuation PDF email print mobile review and failure-state artifacts
      consequence_if_unavailable: Customer delivery remains blocked
    - id: MDS-CAP-008
      capability: Runtime console and network verification
      applicable: [Gate 8 QA Gate 3]
      stage: D3 through D9
      evidence: Targeted flow evidence with console runtime and network findings
      consequence_if_unavailable: Product-quality gate fails

governance:
