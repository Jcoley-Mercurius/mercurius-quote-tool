mds:
  system: Mercurius Design System
  schema_version: "1.2"
  project_id: mercurius-quote-tool
  project_name: Mercurius Quote Tool
  lifecycle: active
  mds_version: "v1.1"
  current_gate: compliance
  mps_project_id: mercurius-quote-tool
  mps_version: "v1.0"
  created_at: "2026-09-08"
  updated_at: "2026-09-15"

revision:
  target_version: "v1.1"
  status: complete
  opened_at: "2026-09-13"
  trigger: Product-owner requirement that every page route have a dedicated canonical route design
  audit: MDS-V1.1-ROUTE-DESIGN-COVERAGE-AUDIT.md
  active_baseline: "v1.1"
  gate_6: route_reference_expansion_approved
  gate_7: refreshed_for_route_reference_completeness
  route_inventory: 21
  dedicated_route_canvases_approved: 21
  dedicated_route_canvases_drafted: 0

project:
  name: Mercurius Quote Tool
  description: Source-aware professional quoting and conversion for Marketplace and direct home-service work.
  product_type: Responsive vendor operating workspace with homeowner/customer quote portals
  audience:
    - Solo home-service contractors
    - Small vendor crews and teams
    - Marketplace homeowners
    - Vendor-acquired direct customers
  platforms:
    - Responsive web
    - Mobile job-site use
  primary_experience: Opportunity to quote to acceptance to source-appropriate payment/job conversion
  scope:
    - Marketplace homeowner repair requests and vendor quote responses
    - Direct vendor-created quotes for customers outside Marketplace
    - Vendor quote pipeline, team workspace, client review, acceptance, and payment handoff
    - Source-aware components, states, layout, responsive behavior, and accessibility
  out_of_scope:
    - Payment-provider selection
    - Data, event, identity, commission, and security architecture
    - Property manager and HOA B2B expansion beyond approved release intent
  status: approved

identity:
  logo:
    asset: references/mercurius-logo.png
    source: Product-owner-supplied Mercurius figure-and-coin mark
    status: approved
    rule: Preserve the exact artwork and proportions; do not redraw, approximate, replace, or omit it on primary branded surfaces or exported artifacts
  personality: [professional, fast, trustworthy, locally_intelligent, transparent]
  brand_adjectives: [premium, practical, calm, capable, human]
  emotional_response: Confidence that the scope, commercial path, and next step are clear
  visual_direction: Inherit approved Marketplace MDS foundations; preserve useful Quote Tool compositions without retaining conflicting emerald, slate, or Inter tokens
  principles:
    - Make the money path unmistakable
    - Move work forward
    - One system with context-aware behavior
    - Professional at the job site
    - AI supports judgment
  references:
    - MDS-REF-001 through MDS-REF-044

color:
  primary:
    ink900: {name: color.brand.ink900, value: "#1F242E", role: Primary content, status: inherited_approved}
    ink800: {name: color.brand.ink800, value: "#29303D", role: Structural action, status: inherited_approved}
  secondary:
    green600: {name: color.brand.green600, value: "#3F8361", role: Trusted progression, status: inherited_approved}
    green500Dark: {name: color.brand.green500Dark, value: "#4FB080", role: Trusted progression on dark, status: inherited_approved}
  accent:
    coral600: {name: color.brand.coral600, value: "#D76742", role: Explicit AI generation, status: inherited_approved}
  neutrals: {}
  semantic:
    success: {name: color.semantic.success, value: "#3F8361", role: Confirmed success, status: inherited_approved}
    warning: {name: color.semantic.warning, value: "#B26B19", role: Attention and recoverable risk, status: inherited_approved}
    error: {name: color.semantic.error, value: "#DC2828", role: Validation and destructive consequence, status: inherited_approved}
    info: {name: color.semantic.info, value: "#308CE8", role: Neutral system information, status: inherited_approved}
  surfaces:
    lightPage: {name: color.surface.lightPage, value: "#FBFAF9", role: Default canvas, status: inherited_approved}
    lightCard: {name: color.surface.lightCard, value: "#FDFDFC", role: Card and quote sheet, status: inherited_approved}
    lightMuted: {name: color.surface.lightMuted, value: "#F6F5F3", role: Quiet grouping, status: inherited_approved}
    lightSecondary: {name: color.surface.lightSecondary, value: "#F1F0EE", role: Recessed and disabled, status: inherited_approved}
    darkPage: {name: color.surface.darkPage, value: "#11151C", role: Bounded photo inspection, status: inherited_approved}
    darkCard: {name: color.surface.darkCard, value: "#1A1F28", role: Dark elevated content, status: inherited_approved}
    darkMuted: {name: color.surface.darkMuted, value: "#222630", role: Quiet dark grouping, status: inherited_approved}
  text:
    lightPrimary: {name: color.text.lightPrimary, value: "#1F242E", role: Primary text, status: inherited_approved}
    lightMuted: {name: color.text.lightMuted, value: "#676F7E", role: Supporting text, status: inherited_approved}
    darkPrimary: {name: color.text.darkPrimary, value: "#EEECE7", role: Text on dark, status: inherited_approved}
  borders:
    light: {name: color.border.light, value: "#E5E2DC", role: Default light border, status: inherited_approved}
    dark: {name: color.border.dark, value: "#323843", role: Default dark border, status: inherited_approved}
    focus: {name: color.border.focus, value: "#4B9B73", role: Persistent focus ring, status: inherited_approved}
  usage_rules:
    - Ink is the default action and structure color
    - Coral is limited to explicit AI generation and bounded AI emphasis
    - Green is limited to trusted progression, verified success, acceptance, and payment progression
    - Marketplace and Direct source use text and icon labels rather than competing source colors
    - Financial values use ink unless they communicate a confirmed accepted or paid outcome

typography:
  display_family: Manrope
  ui_family: Manrope
  mono_family: Optional implementation-approved monospace for quote references only
  weights: {regular: 400, medium: 500, semibold: 600, bold: 700}
  scale:
    display_xl: {desktop: 64px, mobile: 44px}
    display_lg: {desktop: 52px, mobile: 40px}
    h1: {desktop: 44px, mobile: 34px}
    h2: {desktop: 34px, mobile: 28px}
    h3: {desktop: 24px, mobile: 22px}
    title: 18px
    body_large: {desktop: 18px, mobile: 17px}
    body: 16px
    body_small: 14px
    label: 12px
  line_heights: {display_xl: 1.08, display_lg: 1.10, h1: 1.15, h2: 1.20, h3: 1.30, title: 1.40, body_large: 1.60, body: 1.55, body_small: 1.50, label: 1.35}
  letter_spacing: {default: normal}
  roles: {}
  usage_rules:
    - Operational text is never smaller than 14px
    - 12px is limited to short labels with sufficient contrast
    - Display roles are reserved for public marketing
    - Use sentence case and tabular numerals for aligned financial data

spacing:
  base_unit: 4px
  scale: {1: 4px, 2: 8px, 3: 12px, 4: 16px, 5: 20px, 6: 24px, 8: 32px, 10: 40px, 12: 48px, 16: 64px, 20: 80px}
  page_rules: {mobile_gutter: 16-20px, desktop: Inherit Marketplace container and gutters}
  section_rules: {customer: 32-48px, vendor: 24-40px, marketing: 56-96px}
  component_rules: {customer_card_padding: 24-32px, vendor_card_padding: 16-24px, form_group_gap: 24px, control_text_gap: 8-12px, adjacent_actions: 8px minimum}

shape:
  radius: {sm: 8px, md: 12px, lg: 16px, xl: 24px, 2xl: 32px, pill: 9999px}
  borders: {light: "1px #E5E2DC", dark: "1px #323843"}
  dividers: {default: "1px #E5E2DC"}
  shadows: {sm: Inherit parent recipe, base: Inherit parent recipe, md: Inherit parent recipe}
  elevation: {base: Border and surface first, sm: Hover or sticky separation, raised: Menus and popovers, overlay: Dialogs and consequential overlays}

icons:
  family: Lucide or MTS-approved equivalent
  implementation: Reusable icon wrapper
  stroke_style: Rounded outline at 2px
  fill_style: None unless required by a status convention
  sizes: {small: 16px, standard: 20px, feature: 24px}
  custom_icon_rules:
    - Preserve branded marks as supplied assets rather than redraw them as UI icons
  usage_rules:
    - Pair source, financial, status, urgency, and destructive icons with visible text
    - Avoid repeated one-off inline SVG implementations
