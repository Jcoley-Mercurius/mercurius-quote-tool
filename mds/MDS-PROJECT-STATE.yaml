layout:
  max_content_width:
    marketplace_public: 96rem
    operational: 80rem
    guided_detail: 72rem
    reading: 45rem
    client_quote: 72rem
  grid:
    columns: {wide: 12, desktop: 12, tablet: 8, mobile: 4}
    gap: {wide: 24px, desktop: 24px, tablet: 20px, mobile: 16px}
  gutters: {wide: 64px, desktop: 48px, tablet: 32px, mobile: 20px, narrow_mobile: 16px}
  header: {desktop: 64px, mobile: 56px, behavior: Marketplace identity and context}
  sidebar: {desktop_width: 264px, behavior: Sticky grouped vendor navigation beneath header}
  footer: {public: Marketplace footer, authenticated: not_required, client_quote: Minimal Mercurius attribution and legal links}
  section_spacing:
    marketing: {desktop: 96px, tablet: 72px, mobile: 56px}
    operational: {desktop: 48px, tablet: 40px, mobile: 32px}
    compact: {desktop: 32px, tablet: 28px, mobile: 24px}
  page_shells:
    public_marketplace: {status: approved, desktop: Marketplace header and footer with bounded content, mobile: Single column with homeowner action first}
    vendor_workspace: {status: approved, desktop: Header plus grouped left rail and main, mobile: Compact header plus bottom navigation}
    operational_list: {status: approved, desktop: Header metrics filters and rows, mobile: Summary filters sheet and cards}
    detail_action_rail: {status: approved, desktop: 8 column content plus 4 column rail, mobile: Inline summary then safe action bar}
    guided_quote_builder: {status: approved, desktop: 8 column active step plus 4 column summary, mobile: One step plus sticky Back and Continue}
    customer_quote: {status: approved, desktop: 8 column document plus 4 column decision rail, mobile: Document then decision summary and action}
    settings: {status: approved, desktop: 3 column local navigation plus 9 column form, mobile: Section picker and focused form section}
    media_viewer: {status: approved, desktop: Bounded dark overlay, mobile: Full viewport safe area viewer}

responsive:
  breakpoints: {mobile: 640px, tablet: 768px, desktop: 1024px, wide: 1280px, extra_wide: 1536px}
  rules:
    stacking:
      - Summary rails move inline before consequential actions
      - Multi-column forms become one semantic field group at a time
    navigation:
      - Desktop uses grouped left rail
      - Mobile uses Overview Opportunities New quote Quotes and More bottom navigation
      - Public and client quote pages do not show vendor bottom navigation
    sidebar:
      - Collapse global rail before source price deadline or action context
    grid:
      - Operational tables transform into labeled cards without essential horizontal scrolling
      - Filter bands transform into trigger and accessible sheet with active chips retained
    typography:
      - Apply approved mobile type sizes without dropping operational text below 14px
    spacing:
      - Preserve 16 to 20px mobile gutters and safe-area padding
    visibility:
      - Never hide source price deadline payment path or owner action because of viewport width
    media:
      - Preserve captions source and controls
      - Provide button alternatives to swipe and drag
    touch:
      - Preserve 44px targets
      - Sticky surfaces may not overlap focused content browser chrome or each other

patterns:
  landing: {applicability: required, status: approved, composition: Public Marketplace shell, components_used: [Marketplace header, hero, process, evidence, footer], responsive_behavior: Homeowner action first}
  dashboard: {applicability: required, status: approved, composition: Attention-first overview, components_used: [attention list, create quote action, metrics, activity], responsive_behavior: Single-column priority order}
  search_results: {applicability: required, status: approved, composition: Operational list shell, components_used: [search, filters, active chips, rows or cards, empty state], responsive_behavior: Filter sheet and labeled cards}
  detail: {applicability: required, status: approved, composition: Evidence plus action rail, components_used: [source context, summary, evidence, activity, lifecycle action bar], responsive_behavior: Inline summary before action}
  forms: {applicability: required, status: approved, composition: Recoverable five-step guided flow, components_used: [stepper, form section, autosave, validation, action bar], responsive_behavior: One active step on mobile}
  authentication: {applicability: required, status: approved, composition: Marketplace identity with focused authentication card, components_used: [auth form, recovery, legal links], responsive_behavior: Single column}
  empty: {applicability: required, status: approved, composition: Cause preserved context and one legitimate action, components_used: [empty state, action], responsive_behavior: Same semantic order}
  error: {applicability: required, status: approved, composition: Failure consequence preserved state and recovery, components_used: [alert, error summary, recovery action], responsive_behavior: Same semantic order}
  loading: {applicability: required, status: approved, composition: Geometry-matched skeletons or inline progress, components_used: [skeleton, spinner, progress], responsive_behavior: Match responsive final geometry}
  custom:
    opportunity_triage: {status: approved, shell: operational_list}
    opportunity_response: {status: approved, shell: detail_action_rail}
    quote_builder: {status: approved, shell: guided_quote_builder}
    customer_review_acceptance: {status: approved, shell: customer_quote}
    marketplace_comparison: {status: blocked_by_mps_gap, shell: customer_quote}
    source_aware_payment: {status: blocked_by_mps_mts_gap, shell: customer_quote}
    workspace_settings: {status: approved, shell: settings}

visual_language:
  personality: Professional and approachable with local-service credibility
  density: Moderate; operational views may be denser than customer-facing views
  contrast: Clear hierarchy with restrained semantic color
  surface_philosophy: Inherit warm light Marketplace surfaces with bounded vendor-brand expression
  border_philosophy: Inherit quiet warm-gray Marketplace borders; borders define structure before shadows
  shadow_philosophy: Restrained elevation; stronger only for overlays and floating actions
  color_philosophy: Marketplace ink carries structure, green means trusted progression, coral may initiate AI generation, and semantic colors retain distinct meanings
  typography_character: Marketplace Manrope; direct, modern, legible, and premium
  icon_character: Inherit Marketplace Lucide-style outline icons with consistent 2px stroke and optical size
  whitespace_philosophy: Generous customer-facing space; efficient but breathable vendor operations

guidance:
  do:
    - {id: MDS-DO-001, area: color, statement: Use ink for ordinary primary actions, rationale: Preserves green for confirmed progression, status: approved}
    - {id: MDS-DO-002, area: source, statement: Label Marketplace and Direct customer in words with an icon, rationale: Keeps commercial provenance explicit, status: approved}
    - {id: MDS-DO-003, area: identity, statement: Keep vendor branding inside bounded presentation zones, rationale: Protects Mercurius semantic meaning, status: approved}
    - {id: MDS-DO-004, area: ai, statement: Present AI output as a reviewable draft, rationale: AI supports vendor judgment, status: approved}
    - {id: MDS-DO-005, area: shape, statement: Use 12px controls and 16px workflow cards consistently, rationale: Creates a coherent operational rhythm, status: approved}
  dont:
    - {id: MDS-DONT-001, area: color, statement: Do not make every primary action green, rationale: Green means trusted progression, status: approved}
    - {id: MDS-DONT-002, area: color, statement: Do not use coral as a generic accent or urgency color, rationale: Coral identifies bounded AI generation, status: approved}
    - {id: MDS-DONT-003, area: source, statement: Do not encode quote source through color alone, rationale: Source affects commercial terms and must be explicit, status: approved}
    - {id: MDS-DONT-004, area: identity, statement: Do not let vendor colors override system states or Marketplace checkout, rationale: Maintains trust and consistency, status: approved}
    - {id: MDS-DONT-005, area: actions, statement: Do not place delete beside the primary forward action, rationale: Prevents destructive mistakes, status: approved}

accessibility:
  target: WCAG 2.2 AA
  contrast: 4.5 to 1 normal text; 3 to 1 large text and essential UI graphics
  focus: Persistent 3px #4B9B73 ring with visual separation
  keyboard: Existing focus-trapped mobile navigation and semantic controls should be preserved
  touch_targets: 44 by 44 CSS pixel minimum; 52px for prominent progression controls where appropriate
  motion: 150ms fast, 220ms base, 320ms deliberate; honor prefers-reduced-motion
  semantic_markup: Preserve fieldsets, labels, headings, tables, alerts, and status text
  screen_reader: Announce AI generation, save, send, acceptance, payment, errors, and async completion without stealing focus
  image_alternatives: Preserve meaningful alt text; define quote-photo behavior in Gate 3
  additional_rules:
    - Source, status, urgency, price movement, and progress never rely on color alone
    - Sticky actions must not obscure focus, errors, or content
    - Responsive card transformations preserve programmatic label and value relationships

